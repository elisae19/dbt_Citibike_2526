version: 2
sources:
  - name: citibike_dbt_2526
    schema: citibike_dataset
    tables:
      - name: dev_Citibike2526
        description:
          Table dev Citibike NYC, 1er juillet 2025 au 31 juillet 2025.
        #loaded_at_field: started_at
        #freshness:
        #  warn_after: {count: 45, period: day}
        #  error_after: {count: 60, period: day}
        columns:
          - name: ride_id
            description: Identifiant unique du trajet.
            tests:
              - not_null
              - unique:
                  config:
                    severity: warn
          - name: started_at
            description: Heure de début du trajet.
            tests:
              - not_null:
                  config:
                    severity: warn
          - name: ended_at
            description: Heure de fin du trajet.
            tests:
              - not_null:
                  config:
                    severity: warn
          - name: member_casual
            description: Type d'utilisateur (membre ou occasionnel).
            tests:
              - accepted_values:
                  values: ['member', 'casual']
          - name: rideable_type
            description: Type de vélo utilisé.
            tests:
              - accepted_values:
                  values: ['classic_bike', 'electric_bike', 'docked_bike']
      - name: Citibike2526
        description:
          Table prod Citibike NYC, juillet 2025 à juin 2026, concaténation
          des exports mensuels, chargée depuis GCS vers BigQuery.
        #loaded_at_field: started_at
        #freshness:
        #  warn_after: {count: 45, period: day}
        #  error_after: {count: 60, period: day}
        columns:
          - name: ride_id
            description: Identifiant unique du trajet.
            tests:
              - not_null
              - unique:
                  config:
                    severity: warn
          - name: started_at
            description: Heure de début du trajet.
            tests:
              - not_null:
                  config:
                    severity: warn
          - name: ended_at
            description: Heure de fin du trajet.
            tests:
              - not_null:
                  config:
                    severity: warn
          - name: member_casual
            description: Type d'utilisateur (membre ou occasionnel).
            tests:
              - accepted_values:
                  values: ['member', 'casual']
          - name: rideable_type
            description: Type de vélo utilisé.
            tests:
              - accepted_values:
                  values: ['classic_bike', 'electric_bike', 'docked_bike']
